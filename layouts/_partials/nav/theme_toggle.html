<button
  id="theme-toggle"
  aria-label="Toggle dark mode"
  class="p-2 text-center sm:text-left">
  {{ partial "icon.html" (dict "icon" "sun"  "id" "theme-toggle-sun" "class" "hover:cursor-pointer hover:border-gray-400 hover:text-gray-400 focus:border-gray-400 focus:ring-2 focus:ring-gray-400") }}
  {{ partial "icon.html" (dict "icon" "moon" "id" "theme-toggle-moon" "class" "hover:cursor-pointer hover:border-gray-400 hover:text-gray-400 focus:border-gray-400 focus:ring-2 focus:ring-gray-400") }}
</button>
