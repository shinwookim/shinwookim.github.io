{{- $icon := .icon -}}
{{- $class := .class | default "" -}}
{{- $id := .id | default "" -}}
{{- $svg := printf "icons/%s.svg" $icon | resources.Get -}}

{{- if $svg -}}
  <span
    class="{{ $class }} inline-block h-[1.25em] w-[1.25em] overflow-visible fill-current align-[-0.25em]"
    id="{{ $id }}">
    {{ $svg.Content | safeHTML }}
  </span>
{{- end -}}
