{{ define "main" }}
  <h1 class="mb-5">{{ .Title }}</h1>
  <div class="not-prose mx-auto mt-3 flex flex-wrap justify-center gap-2">
    {{ range .Pages }}
      <span class="border px-3 py-1 text-sm">
        <a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>
      </span>
    {{- end }}
  </div>
  {{ $mainSection := index site.Params.mainSections 0 | default "posts" }}
  {{ with site.GetPage $mainSection }}
    <div class="mt-3 flex justify-center">
      <a
        class="border px-3 py-1 text-sm no-underline"
        href="{{ .RelPermalink }}">
        ↪ Back to all posts
      </a>
    </div>
  {{ end }}
{{ end }}
