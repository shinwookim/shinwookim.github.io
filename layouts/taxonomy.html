{{ define "body" }}
  <main class="prose-custom prose-headings:my-1 prose-headings:mb-0">
    <h1 class="mb-5">{{ .Title }}</h1>
    <div class="not-prose mx-auto mt-3 flex flex-wrap justify-center gap-2">
      {{ range .Pages }}
        <span class="border px-3 py-1 text-sm">
          <a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>
        </span>
      {{- end }}
    </div>
  </main>

  <footer class="my-3 border-t">{{ partial "footer.html" . }}</footer>

  {{ partial "scripts.html" . }}
{{ end }}
